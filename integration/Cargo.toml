[package]
name = "hoprd-integration-test"
version = "0.1.0"
edition = "2024"
description = "Cross-repo integration throughput test: edgli + hoprd localcluster + blokli/anvil"
license = "GPL-3.0-only"
publish = false

[dependencies]
# edgli re-exports hopr_lib, strategy, traits and BlockchainConnectorConfig, so it
# is the single source of the hoprnet rev — no second git dep to keep in sync.
# Tracks edge-client `main`, which is what CI resolves to anyway: scripts/integration/run.sh
# rewrites this to EDGLI_REF (default `main` HEAD, or the rev from a merge dispatch) and runs
# `cargo update -p edgli`. A branch rather than a `rev` keeps the committed default from drifting
# behind what CI actually tests; the lock still pins the exact commit for reproducibility.
#
# To test an unmerged edge-client change, override the ref rather than committing a rev here.
#
# Back on `main` as of edge-client#175, which followed hoprnet#8430 (`pix_ssa_quota` gone from
# `HoprSessionClientConfig`). Before it merged, `main` did not compile against the rev below — and
# did not notice, because edgli's own lock holds `hopr-lib` behind the `master` branch its manifest
# names, and a dependency's lock is ignored from here. Worth remembering the next time edgli's CI
# is green and this is not.
edgli = { git = "https://github.com/hoprnet/edge-client", branch = "main", default-features = false, features = [
  "runtime-tokio",
  "blokli",
] }

# Pulled in only to switch on hopr-lib's `telemetry` feature, which is what compiles
# `mod telemetry` into hopr-transport-session. Without it every per-session counter is absent
# rather than zero, and "the session received nothing" is indistinguishable from "the metric was
# never built". Must name the same source edgli resolves, or the lock carries two hopr-libs and
# the entry runs a mixture of the two.
#
# "Same source" means the same git *reference*, not merely the same commit. edge-client#170 moved
# its own pin from a `rev` to `branch = "master"`, and naming a `rev` here that resolves to the
# identical commit still splits the graph — measured, on this manifest:
#
#   git+https://github.com/hoprnet/hoprnet?branch=master#11b5f1b6...
#   git+https://github.com/hoprnet/hoprnet?rev=11b5f1b6...#11b5f1b6...
#
# Two lock entries, two builds of `hopr-lib`, one of them carrying the counters and the other
# carrying the entry. So this tracks `master` because edgli does, and the exact commit lives in
# `Cargo.lock` instead — pinned with `cargo update -p hopr-lib --precise <sha>`, which is
# reproducible for anyone who builds from the committed lock and is what CI resolves.
#
# The cost of the branch is that a bare `cargo update` walks this to hoprnet's tip, which is not
# necessarily the rev the Exit binary was built from. Check it against `hoprd`'s own `Cargo.toml`
# when you touch the lock; `just pix-shapes` cannot, because the Exit is a binary by then.
#
# To test an unmerged hoprnet change, override this alongside `edgli` rather than committing a
# feature branch here.
hopr-lib = { git = "https://github.com/hoprnet/hoprnet", branch = "master", default-features = false, features = [
  "telemetry",
] }

# Same trick as `hopr-lib` above, for the other half of the PIX picture. edge-client enables
# `hopr-lib/telemetry` but NOT `hopr-strategy/telemetry`, so without this every entry-side
# `hopr_strategy_pix_*` counter is absent rather than zero — and "the entry never deposited" and
# "the counter was never built" are the same reading. Same source and version edgli resolves, so
# the features unify onto one copy rather than adding a second.
#
# "Same version" is the load-bearing half, and it moves with the `hopr-lib` rev above: 4.0.0 is
# what edge-client resolves on that rev, and a different major here would link a second
# `hopr-strategy` whose counters are registered in the same process but incremented by nobody. The
# reading would be a full set of zeroes rather than an error — which is the exact conclusion
# `tests/pix.rs` draws from a zero. 1.0.2 → 4.0.0 came with the hoprnet bump; keep the three lines
# in step.
#
# Not behind the `pix` feature: an unconditional feature flag on a dependency the entry already
# links is cheaper than a conditional one, and the counters cost nothing when PIX is off.
hopr-strategy = { version = "4.0.0", default-features = false, features = [
  "telemetry",
] }

anyhow = "1"
futures = "0.3"
tokio = { version = "1", features = ["full", "process"] }
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
] }
tempfile = "3"
sha2 = "0.11"
nix = { version = "0.31", features = ["signal"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Only pulled in by the `prof` feature (executor-starvation profiling); see
# tests/profiling.rs. Must be built with `--cfg tokio_unstable`.
console-subscriber = { version = "0.5", optional = true }

[features]
# Executor-starvation profiling: enables the tokio-console layer used by
# tests/profiling.rs. Build with `--profile tracer` and
# `RUSTFLAGS="--cfg tokio_unstable --check-cfg cfg(tokio_unstable)"`.
prof = ["dep:console-subscriber"]

# Entry-side PIX: compiles `src/pix.rs`, the PIX half of `src/env.rs`, and `tests/pix.rs`.
#
# Off by default so the CI throughput build does not pull PIX in — it selects a deposit pool three
# crates away and changes what `HoprPixSpec` resolves to, which is not something the 0-hop/1-hop
# tests should carry silently.
#
# `pix-test` is edge-client's secp256k1 pool: the only implemented one, and visible on-chain. Its
# sibling `pix-curvy` is the anonymous pool and is a stub whose methods panic on the first deposit,
# so it is not an alternative here.
pix = ["edgli/pix-test"]

[dev-dependencies]
test-log = { version = "0.2", features = ["trace"] }
# Perfetto/Chrome trace layer for tests/profiling.rs (only referenced under `prof`).
tracing-chrome = "0.7"

# tokio-console build target for the `prof` profiling tests. hopr-lib forces
# `tracing/release_max_level_debug`, compiling out TRACE callsites (incl. tokio's task
# instrumentation) in release. That cap only fires under `cfg(not(debug_assertions))`, so
# re-enabling debug-asserts makes it inert and STATIC_MAX_LEVEL falls through to TRACE —
# tokio-console then sees the task spans. Optimizations stay on so timings are realistic:
#   RUSTFLAGS="--cfg tokio_unstable --check-cfg cfg(tokio_unstable)" \
#     cargo test --test profiling --profile tracer --features prof -- --ignored
[profile.tracer]
inherits = "release"
debug-assertions = true

# System-profiler (samply / cargo-flamegraph) build target — see docs/flamegraph.md.
# Inherits release (optimised; HOPR's async future chains overflow the debug stack) but
# keeps full debug symbols so the sampler resolves frames instead of showing `??`.
[profile.flamegraph]
inherits = "release"
debug = true
