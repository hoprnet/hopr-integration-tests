[package]
name = "hoprd-integration-test"
version = "0.1.0"
edition = "2024"
description = "Cross-repo integration throughput test: edgli + hoprd localcluster + blokli/anvil"
license = "GPL-3.0-only"
publish = false

[dependencies]
# edgli re-exports hopr_lib, strategy, traits and BlockchainConnectorConfig, so it
# is the single source of the hoprnet rev — no second git dep to keep in sync.
# Tracks edge-client `release/4.1`, NOT `main`. edge-client `main` moved its hopr-lib pin to
# hoprnet `master` (v5) in #151 on 2026-09-04 — that rev is `identical` to master and `diverged`
# from `release/4.0` — so tracking `main` would pair a v5 edge client with the v4 hoprd this gate
# exists to test. `release/4.1` is cut from 1e211419, the last commit whose hopr-lib was still
# `branch = "release/4.0"`.
#
# scripts/integration/run.sh rewrites this to EDGLI_REF and runs `cargo update -p edgli`. A branch
# rather than a `rev` keeps the committed default from drifting behind what CI tests; the lock
# still pins the exact commit for reproducibility.
#
# To test an unmerged edge-client change, override the ref rather than committing a rev here.
edgli = { git = "https://github.com/hoprnet/edge-client", branch = "release/4.1", default-features = false, features = [
  "runtime-tokio",
  "blokli",
  # Switches on `hopr-lib/telemetry`, which is what compiles `mod telemetry` into
  # hopr-transport-session. Without it every per-session counter is absent rather
  # than zero, and "the session received nothing" is indistinguishable from "the
  # metric was never built".
  #
  # Requested through edgli's OWN feature rather than by depending on hopr-lib here
  # and enabling it there. A direct dependency has to name the same source edgli
  # names or cargo resolves two separate hopr-lib packages, and the feature then
  # applies to ours while `edgli::hopr_lib` — which all of this code actually uses —
  # gets the other one without it. That is exactly what broke on 2026-09-04:
  # edge-client main moved its pin to a `rev` that had diverged from `release/4.0`,
  # and `edgli::hopr_lib::collect_hopr_metrics` vanished because that copy was built
  # without `telemetry`. Going through edgli makes the mismatch impossible.
  "telemetry",
] }

anyhow = "1"
futures = "0.3"
tokio = { version = "1", features = ["full", "process"] }
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
] }
tempfile = "3"
sha2 = "0.11"
nix = { version = "0.31", features = ["signal"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Only pulled in by the `prof` feature (executor-starvation profiling); see
# tests/profiling.rs. Must be built with `--cfg tokio_unstable`.
console-subscriber = { version = "0.5", optional = true }

[features]
# Executor-starvation profiling: enables the tokio-console layer used by
# tests/profiling.rs. Build with `--profile tracer` and
# `RUSTFLAGS="--cfg tokio_unstable --check-cfg cfg(tokio_unstable)"`.
prof = ["dep:console-subscriber"]

[dev-dependencies]
test-log = { version = "0.2", features = ["trace"] }
# Perfetto/Chrome trace layer for tests/profiling.rs (only referenced under `prof`).
tracing-chrome = "0.7"

# tokio-console build target for the `prof` profiling tests. hopr-lib forces
# `tracing/release_max_level_debug`, compiling out TRACE callsites (incl. tokio's task
# instrumentation) in release. That cap only fires under `cfg(not(debug_assertions))`, so
# re-enabling debug-asserts makes it inert and STATIC_MAX_LEVEL falls through to TRACE —
# tokio-console then sees the task spans. Optimizations stay on so timings are realistic:
#   RUSTFLAGS="--cfg tokio_unstable --check-cfg cfg(tokio_unstable)" \
#     cargo test --test profiling --profile tracer --features prof -- --ignored
[profile.tracer]
inherits = "release"
debug-assertions = true

# System-profiler (samply / cargo-flamegraph) build target — see docs/flamegraph.md.
# Inherits release (optimised; HOPR's async future chains overflow the debug stack) but
# keeps full debug symbols so the sampler resolves frames instead of showing `??`.
[profile.flamegraph]
inherits = "release"
debug = true
