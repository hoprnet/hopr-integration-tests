[package]
name = "hoprd-integration-test"
version = "0.1.0"
edition = "2024"
description = "Cross-repo integration throughput test: edgli + hoprd localcluster + blokli/anvil"
license = "GPL-3.0-only"
publish = false

[dependencies]
# edgli re-exports hopr_lib, strategy, traits and BlockchainConnectorConfig, so it
# is the single source of the hoprnet rev — no second git dep to keep in sync.
#
# This manifest is the **v4 line**: edge-client `release/4.1`, cut from 1e211419 — the last
# commit whose hopr-lib pin was still `branch = "release/4.0"`. edge-client `main` repinned to
# hoprnet `master` (v5) in #151 on 2026-09-04, so tracking `main` here would pair a v5 edge
# client with the v4 hoprd this gate exists to test. The v5 counterpart lives in
# `Cargo.v5.toml`; `scripts/integration/run.sh` swaps it in when LINE=v5.
#
# `telemetry` is what compiles `mod telemetry` into hopr-transport-session. Without it every
# per-session counter is absent rather than zero, and "the session received nothing" is
# indistinguishable from "the metric was never built". Requesting it through edgli rather than
# through a second `hopr-lib` dependency of our own is deliberate: a direct dep has to name the
# exact same source and rev edgli resolves, and any drift links two hopr-libs whose metrics are
# registered in one process and incremented by different copies.
#
# run.sh rewrites this to EDGLI_REF and runs `cargo update -p edgli`. A branch rather than a
# `rev` keeps the committed default from drifting behind what CI tests; the lock still pins the
# exact commit for reproducibility. To test an unmerged edge-client change, override the ref
# rather than committing a rev here.
edgli = { git = "https://github.com/hoprnet/edge-client", branch = "release/4.1", default-features = false, features = [
  "runtime-tokio",
  "blokli",
  "telemetry",
] }



anyhow = "1"
futures = "0.3"
tokio = { version = "1", features = ["full", "process"] }
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
] }
tempfile = "3"
sha2 = "0.11"
nix = { version = "0.31", features = ["signal"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Only pulled in by the `prof` feature (executor-starvation profiling); see
# tests/profiling.rs. Must be built with `--cfg tokio_unstable`.
console-subscriber = { version = "0.5", optional = true }

[features]
# Executor-starvation profiling: enables the tokio-console layer used by
# tests/profiling.rs. Build with `--profile tracer` and
# `RUSTFLAGS="--cfg tokio_unstable --check-cfg cfg(tokio_unstable)"`.
prof = ["dep:console-subscriber"]

# Entry-side PIX: v5 only, and inert here.
#
# Declared so `#[cfg(feature = "pix")]` stays a *known* cfg — without the key, `-D warnings`
# fails the build on `unexpected_cfgs`. Enabling it on this line does not work: PIX needs edgli's
# `pix-test` deposit pool, which exists only on v5. Run the PIX scenarios with LINE=v5, which
# swaps in `Cargo.v5.toml`.
pix = []

[dev-dependencies]
test-log = { version = "0.2", features = ["trace"] }
# Perfetto/Chrome trace layer for tests/profiling.rs (only referenced under `prof`).
tracing-chrome = "0.7"

# tokio-console build target for the `prof` profiling tests. hopr-lib forces
# `tracing/release_max_level_debug`, compiling out TRACE callsites (incl. tokio's task
# instrumentation) in release. That cap only fires under `cfg(not(debug_assertions))`, so
# re-enabling debug-asserts makes it inert and STATIC_MAX_LEVEL falls through to TRACE —
# tokio-console then sees the task spans. Optimizations stay on so timings are realistic:
#   RUSTFLAGS="--cfg tokio_unstable --check-cfg cfg(tokio_unstable)" \
#     cargo test --test profiling --profile tracer --features prof -- --ignored
[profile.tracer]
inherits = "release"
debug-assertions = true

# System-profiler (samply / cargo-flamegraph) build target — see docs/flamegraph.md.
# Inherits release (optimised; HOPR's async future chains overflow the debug stack) but
# keeps full debug symbols so the sampler resolves frames instead of showing `??`.
[profile.flamegraph]
inherits = "release"
debug = true
