self-hosted-runner:
  labels:
    # Hosted (depot) runners: PR title validation and the fmt/clippy job. Anything
    # that only compiles can live on a throwaway VM.
    - depot-ubuntu-24.04
    - depot-ubuntu-24.04-4
    # The self-hosted Hetzner box, provisioned by gitops/ansible
    # (playbooks/install-github-hetzner-runner.yaml). Everything that EXECUTES a
    # test lands here — the unit tests and the whole integration throughput gate —
    # so results come from one known machine. See runner/README.md.
    - hetzner
# The pre-commit hook's actionlint (1.7.9, nix-pinned) predates `concurrency.queue`, which GitHub accepts.
paths:
  .github/workflows/integration.yaml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
