name: PR
# Validate PR metadata and check the integration crate. Split by what each step
# actually needs: `fmt`/`clippy` are pure compile-time checks and run on a hosted
# depot runner, and unit tests run on a hosted depot runner too, so they cannot queue
# behind integration runs on the self-hosted box. The heavy end-to-end run lives in
# integration.yaml. See runner/README.md.
#
# Both jobs fan out over the two release lines: shared source, two dependency sets
# (`Cargo.toml` = v4, `Cargo.v5.toml` = v5), and v5 is the line carrying PIX.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Required status checks are evaluated on the MERGE GROUP once a merge queue is
  # enabled, not on the pull request. A check that only runs on `pull_request` never
  # reports for a queue candidate, so requiring it would park every entry until the
  # queue's max-wait elapsed and then evict it. These jobs therefore have to run
  # here too — they are cheap, and running them against the candidate is the point.
  merge_group:
    types: [checks_requested]
permissions: {}
concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-pr
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  # `nix develop` is gated behind these experimental flags. Client-side settings,
  # so setting them here keeps the jobs working regardless of what the runner's
  # /etc/nix/nix.conf says — see runner/README.md.
  NIX_CONFIG: |
    extra-experimental-features = nix-command flakes
jobs:
  validate-pr-title:
    name: Validate title
    # PR-only: a queue candidate has no pull request, so
    # `github.event.pull_request` is null and the action below has nothing to read.
    # Consequently do NOT make this a required check — it cannot report on a merge
    # group. Conventional-commit enforcement stays a pre-queue check.
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            build
            chore
            ci
            docs
            style
            refactor
            perf
            test
            revert
          requireScope: false
  shell:
    name: Shell lint
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo: false
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Nix
        uses: hoprnet/hopr-workflows/actions/setup-nix@061b4579c870b0fdc008f5ff07a3a500e4fede50 # setup-nix-v2.2.2
        with:
          cachix_cache_name: hoprnet
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # `-i 2` matches what treefmt's shfmt writes; raw shfmt defaults to tabs.
      - name: shellcheck + shfmt
        run: |
          nix develop . --command bash -c '
            shellcheck scripts/integration/*.sh scripts/*.sh
            shfmt -i 2 -d scripts/
          '
      # The scripts grew by copying: a fork of the runner, three chain pollers, six reapers.
      # A hard cap is the guardrail; shared logic belongs in lib.sh, not in a new file.
      - name: Script budget
        run: |
          n=$(find scripts/integration -maxdepth 1 -name '*.sh' | wc -l | tr -d ' ')
          [ "${n}" -le 5 ] || {
            echo "::error::script budget exceeded (${n} > 5) — put shared logic in scripts/integration/lib.sh"
            exit 1
          }
  lint:
    name: Format + clippy (${{ matrix.line }})
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: true
      matrix:
        line: [v4, v5]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo: false
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Nix
        uses: hoprnet/hopr-workflows/actions/setup-nix@061b4579c870b0fdc008f5ff07a3a500e4fede50 # setup-nix-v2.2.2
        with:
          cachix_cache_name: hoprnet
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # The crate builds in the hoprnet dev shell (it provides the rust toolchain
      # + the cached hopr-lib/edgli dependency tree).
      # Same swap run.sh does. Its own step rather than a branch inside the single-quoted
      # `bash -c` body below, where any `${...}` is an SC2016 finding that fails actionlint.
      - name: Select the v5 dependency set
        if: matrix.line == 'v5'
        run: |
          cp integration/Cargo.v5.toml integration/Cargo.toml
          cp integration/Cargo.v5.lock integration/Cargo.lock
      # The edgli run.sh would test: a companion PR head, else the line's branch head. The
      # committed locks are only the default for local runs.
      - name: Pin edgli
        env:
          LINE: ${{ matrix.line }}
          GH_TOKEN: ${{ github.token }}
        run: nix develop github:hoprnet/hoprnet --command bash -euo pipefail scripts/integration/lib.sh pin_line_deps
      # `--all-features` means "everything this line declares": on v4 that is `prof`, on v5 it
      # also picks up `v5`, which carries PIX. Revisit if a mutually exclusive feature is ever
      # added — edgli's `pix-curvy` is one, so do not forward it alongside `pix-test`.
      - name: Format + clippy
        run: |
          nix develop github:hoprnet/hoprnet --command bash -c '
            set -euo pipefail
            cd integration
            cargo fmt --check
            cargo clippy -p hoprd-integration-test --all-targets --all-features -- -D warnings
          '
  unit:
    name: Unit tests (${{ matrix.line }})
    # Stage 2: runs only after the cheap hosted stage 1 (shell, lint) is green. No
    # `always()`: a failed stage 1 skips this job and reds the merge gate.
    needs: [shell, lint]
    # Hosted, like lint, so fork code runs in a throwaway VM and the job never queues behind
    # a 40-80 min integration run on the self-hosted box.
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    strategy:
      # A red line cancels the other: the first failure is the one to read.
      fail-fast: true
      matrix:
        line: [v4, v5]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo: false
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Nix
        uses: hoprnet/hopr-workflows/actions/setup-nix@061b4579c870b0fdc008f5ff07a3a500e4fede50 # setup-nix-v2.2.2
        with:
          cachix_cache_name: hoprnet
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Same swap run.sh does. Its own step rather than a branch inside the single-quoted
      # `bash -c` body below, where any `${...}` is an SC2016 finding that fails actionlint.
      - name: Select the v5 dependency set
        if: matrix.line == 'v5'
        run: |
          cp integration/Cargo.v5.toml integration/Cargo.toml
          cp integration/Cargo.v5.lock integration/Cargo.lock
      # The edgli run.sh would test: a companion PR head, else the line's branch head. The
      # committed locks are only the default for local runs.
      - name: Pin edgli
        env:
          LINE: ${{ matrix.line }}
          GH_TOKEN: ${{ github.token }}
        run: nix develop github:hoprnet/hoprnet --command bash -euo pipefail scripts/integration/lib.sh pin_line_deps
      # 101 tests on v4, 112 on v5 — the extra eleven are the v5-gated ones: the src/pix.rs
      # Prometheus parser (2) and the src/relay_loss.rs profile arithmetic (9).
      - name: Unit tests
        run: |
          nix develop github:hoprnet/hoprnet --command bash -c '
            set -euo pipefail
            cd integration
            cargo test --lib --all-features
          '
      # Use the real test binary to discover scenarios. A typo must fail before starting
      # a chain and leave its diagnostic and run status available to the caller.
      - name: Runner rejects an unknown scenario and preserves its status
        run: |
          nix develop github:hoprnet/hoprnet --command bash -euo pipefail <<'BASH'
          log_dir=$(mktemp -d)
          trap 'rm -rf "${log_dir}"' EXIT
          code=0
          CHAIN_SHARED=1 HOPR_LOG_DIR="${log_dir}" SCENARIOS_EXCEPT=__nonexistent_ci_scenario__ \
            bash scripts/integration/run-binchain.sh >"${log_dir}/output.log" 2>&1 || code=$?
          cat "${log_dir}/output.log"
          [ "${code}" = 1 ]
          grep -Fq "SCENARIOS_EXCEPT names '__nonexistent_ci_scenario__', which is not a test" "${log_dir}/output.log"
          runs=("${log_dir}"/run-*)
          [ "${#runs[@]}" = 1 ]
          [ -s "${runs[0]}/run.env" ]
          grep -qx 'status=failed' "${runs[0]}/run.status"
          grep -qx 'exit_code=1' "${runs[0]}/run.status"
          [ ! -e "${runs[0]}/chain" ]
          [ ! -e "${runs[0]}/client-integration.log" ]
          BASH
  # Fan-in job. The matrix names each job per line, so the bare context the ruleset
  # requires would never report and every queue entry would hang until its timeout.
  lint-gate:
    name: Format + clippy
    needs: lint
    if: always()
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULT: ${{ needs.lint.result }}
        run: |
          echo "lint matrix result: ${RESULT}"
          [ "${RESULT}" = success ] || { echo "::error::lint result is '${RESULT}'"; exit 1; }
  # Single aggregate merge gate: green only if every other job in this run
  # succeeded. Runs on a hosted runner.
  # `if: always()` runs it even when a dependency fails;
  # alls-green then reds the gate on any non-success (a failed job, or a skip
  # that is not allowed).
  merge-gate:
    name: Merge gate
    if: always()
    needs:
      - validate-pr-title
      - shell
      - lint
      - unit
      - lint-gate
    runs-on: depot-ubuntu-24.04
    permissions: {}
    steps:
      - name: Require all jobs to pass
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          # validate-pr-title runs on pull_request only; every other job must run.
          allowed-skips: validate-pr-title
